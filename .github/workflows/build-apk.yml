name: Build AIMRELAX LIVE V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AIMRELAX LIVE V6
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AIMRELAX_LIVE

    steps:
      # --------------------------------------------------
      # 1. Download repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 3. Check project structure
      # --------------------------------------------------
      - name: Verify V6 project
        run: |
          echo "Checking AIMRELAX LIVE V6 project..."
          pwd

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found in AIMRELAX_LIVE/"
            exit 1
          fi

          if [ ! -f "lib/main.dart" ]; then
            echo "ERROR: lib/main.dart not found."
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "ERROR: android directory not found."
            exit 1
          fi

          echo "V6 Flutter project detected successfully."

      # --------------------------------------------------
      # 4. Show Flutter/Dart versions
      # --------------------------------------------------
      - name: Flutter version
        run: |
          flutter --version
          dart --version

      # --------------------------------------------------
      # 5. Get dependencies
      # --------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      # --------------------------------------------------
      # 6. Analyze project
      # --------------------------------------------------
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      # --------------------------------------------------
      # 7. Clean old build files
      # --------------------------------------------------
      - name: Flutter clean
        run: flutter clean

      # --------------------------------------------------
      # 8. Get dependencies again after clean
      # --------------------------------------------------
      - name: Flutter pub get after clean
        run: flutter pub get

      # --------------------------------------------------
      # 9. Build release APK
      # --------------------------------------------------
      - name: Build release APK
        run: flutter build apk --release

      # --------------------------------------------------
      # 10. Verify APK
      # --------------------------------------------------
      - name: Verify generated APK
        run: |
          echo "Generated APK files:"
          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print

          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

      # --------------------------------------------------
      # 11. Rename APK
      # --------------------------------------------------
      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/AIMRELAX-LIVE-V6.apk

      # --------------------------------------------------
      # 12. Upload APK to GitHub Actions
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-V6
          path: AIMRELAX_LIVE/build/app/outputs/flutter-apk/AIMRELAX-LIVE-V6.apk
          if-no-files-found: error
          retention-days: 30
