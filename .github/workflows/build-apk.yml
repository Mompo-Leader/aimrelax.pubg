name: Build AIMRELAX LIVE Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find AIMRELAX Flutter project
        run: |
          echo "======================================"
          echo "FINDING AIMRELAX LIVE PROJECT"
          echo "======================================"

          PROJECT_DIR=""

          while IFS= read -r pubspec; do
            DIR=$(dirname "$pubspec")

            if [ -f "$DIR/lib/main.dart" ] && \
               [ -f "$DIR/lib/screens/live_screen.dart" ] && \
               [ -f "$DIR/lib/live/live_service.dart" ]; then

              PROJECT_DIR="$DIR"
              break
            fi

          done < <(find . -type f -name "pubspec.yaml")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: AIMRELAX LIVE Flutter project not found."
            find . -type f -name "pubspec.yaml"
            exit 1
          fi

          echo "PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Inspect Live files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "LIVE FILES"
          echo "======================================"

          echo ""
          echo "live_screen.dart:"
          ls -lh lib/screens/live_screen.dart

          echo ""
          echo "live_service.dart:"
          ls -lh lib/live/live_service.dart

          echo ""
          echo "Searching screen capture code..."

          grep -nEi \
            "getDisplayMedia|displayMedia|MediaProjection|screenCapture|screen capture|navigator.mediaDevices" \
            lib/screens/live_screen.dart \
            lib/live/live_service.dart \
            || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "GENERATING ANDROID PROJECT"
          echo "======================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org=com.aimrelax \
            --project-name=aimrelax_live \
            .

      - name: Configure Android MediaProjection
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "CONFIGURING ANDROID SCREEN CAPTURE"
          echo "======================================"

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.CHANGE_NETWORK_STATE',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.RECORD_AUDIO',
              'android.permission.CAMERA',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION',
              'android.permission.FOREGROUND_SERVICE_MICROPHONE',
              'android.permission.POST_NOTIFICATIONS',
          ]

          for permission in permissions:
              line = f'<uses-permission android:name="{permission}"/>'

              if line not in text:
                  text = text.replace(
                      '<application',
                      f'    {line}\n\n    <application',
                      1
                  )

          path.write_text(text)

          print("MediaProjection permissions configured.")
          PY

          echo ""
          echo "AndroidManifest permissions:"
          grep -n "permission" "$MANIFEST"

      - name: Configure minimum SDK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          GRADLE="android/app/build.gradle.kts"

          if [ -f "$GRADLE" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$GRADLE"
          fi

          echo "Minimum Android SDK configured."

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Verify flutter_webrtc
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "VERIFYING FLUTTER WEBRTC"
          echo "======================================"

          if grep -n "flutter_webrtc" pubspec.yaml; then
            echo ""
            echo "flutter_webrtc dependency found."
          else
            echo ""
            echo "ERROR: flutter_webrtc is missing."
            exit 1
          fi

          echo ""
          flutter pub deps | grep flutter_webrtc || true

      - name: Verify Live implementation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "LIVE IMPLEMENTATION CHECK"
          echo "======================================"

          echo ""
          echo "Checking live_screen.dart..."

          grep -nEi \
            "getDisplayMedia|displayMedia|MediaProjection|screenCapture|screen capture|navigator.mediaDevices" \
            lib/screens/live_screen.dart \
            || true

          echo ""
          echo "Checking live_service.dart..."

          grep -nEi \
            "getDisplayMedia|displayMedia|MediaProjection|screenCapture|screen capture|navigator.mediaDevices" \
            lib/live/live_service.dart \
            || true

          echo ""
          echo "Checking all Dart files..."

          grep -RInEi \
            "navigator.mediaDevices|getDisplayMedia" \
            lib \
            || true

      - name: Clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "BUILDING AIMRELAX LIVE"
          echo "======================================"

          flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK CREATED:"
          ls -lh "$APK"

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/AIMRELAX-LIVE-NATIVE-SCREEN.apk

          ls -lh release/AIMRELAX-LIVE-NATIVE-SCREEN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-Native-Screen
          path: ${{ env.PROJECT_DIR }}/release/AIMRELAX-LIVE-NATIVE-SCREEN.apk
          if-no-files-found: error
