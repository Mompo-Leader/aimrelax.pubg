name: AIMRELAX LIVE - Android Verified APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AIMRELAX LIVE Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Verify exact V10.2 ZIP
      # --------------------------------------------------
      - name: Verify V10.2 project ZIP
        run: |
          set -e

          echo "======================================"
          echo "AIMRELAX LIVE V10.2"
          echo "======================================"

          echo "Repository root:"
          pwd

          echo ""
          echo "Repository files:"
          ls -lah

          ZIP="./AIMRELAX_LIVE_V10_2_FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: V10.2 ZIP was not found:"
            echo "$ZIP"
            echo ""
            echo "Available AIMRELAX ZIP files:"
            find . -maxdepth 1 -type f -name "AIMRELAX_LIVE_*.zip" -print
            exit 1
          fi

          echo ""
          echo "EXACT ZIP SELECTED:"
          echo "$ZIP"

          echo ""
          echo "ZIP CONTENT:"
          unzip -l "$ZIP"

      # --------------------------------------------------
      # 3. Extract V10.2
      # --------------------------------------------------
      - name: Extract V10.2 project
        run: |
          set -e

          ZIP="./AIMRELAX_LIVE_V10_2_FINAL.zip"

          echo "Extracting:"
          echo "$ZIP"

          unzip -o "$ZIP" -d .

          echo ""
          echo "After extraction:"
          ls -lah

      # --------------------------------------------------
      # 4. Locate project files
      # --------------------------------------------------
      - name: Prepare project root
        run: |
          set -e

          echo "Searching for build-live-v2.sh..."

          SCRIPT=$(find . -type f -name "build-live-v2.sh" | head -n 1)

          if [ -z "$SCRIPT" ]; then
            echo "ERROR: build-live-v2.sh not found"
            exit 1
          fi

          echo "Found:"
          echo "$SCRIPT"

          PROJECT_DIR=$(dirname "$SCRIPT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -lah "$PROJECT_DIR"

      # --------------------------------------------------
      # 5. Setup Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 6. Setup Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # 7. Check Flutter
      # --------------------------------------------------
      - name: Flutter version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter --version
          dart --version

      # --------------------------------------------------
      # 8. Check V10.2 live_service.dart
      # --------------------------------------------------
      - name: Verify V10.2 live_service.dart
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          FILE="lib/live/live_service.dart"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          echo "Checking live_service.dart..."

          echo ""
          echo "setMicrophoneEnabled occurrences:"
          grep -n "setMicrophoneEnabled" "$FILE" || true

          echo ""
          echo "localParticipant occurrences:"
          grep -n "localParticipant" "$FILE" || true

          echo ""
          echo "V10.2 source file found."

      # --------------------------------------------------
      # 9. Prepare Android signing
      # --------------------------------------------------
      - name: Prepare Android signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          AIMRELAX_KEYSTORE_B64: ${{ secrets.AIMRELAX_KEYSTORE_B64 }}
          AIMRELAX_STORE_PASSWORD: ${{ secrets.AIMRELAX_STORE_PASSWORD }}
          AIMRELAX_KEY_PASSWORD: ${{ secrets.AIMRELAX_KEY_PASSWORD }}
          AIMRELAX_KEY_ALIAS: ${{ secrets.AIMRELAX_KEY_ALIAS }}
        run: |
          set -e

          if [ ! -f "scripts/prepare_signing.sh" ]; then
            echo "ERROR: scripts/prepare_signing.sh not found"
            exit 1
          fi

          chmod +x scripts/prepare_signing.sh

          bash scripts/prepare_signing.sh

      # --------------------------------------------------
      # 10. Configure Android
      # --------------------------------------------------
      - name: Configure Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ ! -f "scripts/configure_android.py" ]; then
            echo "ERROR: scripts/configure_android.py not found"
            exit 1
          fi

          python3 scripts/configure_android.py

      # --------------------------------------------------
      # 11. Flutter dependencies
      # --------------------------------------------------
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          flutter pub get

      # --------------------------------------------------
      # 12. Analyze
      # --------------------------------------------------
      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter analyze

      # --------------------------------------------------
      # 13. Clean
      # --------------------------------------------------
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter clean
          flutter pub get

      # --------------------------------------------------
      # 14. Build release APK
      # --------------------------------------------------
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter build apk --release

      # --------------------------------------------------
      # 15. Check unsigned/generated APK
      # --------------------------------------------------
      - name: Check generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "Generated APK:"
          ls -lh "$APK"

      # --------------------------------------------------
      # 16. Locate apksigner
      # --------------------------------------------------
      - name: Locate Android apksigner
        id: apksigner
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER"

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 17. Sign APK
      # --------------------------------------------------
      - name: Sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          mkdir -p release

          echo "Signing APK..."

          source android/signing.env

          "$APKSIGNER" sign \
            --ks "$AIMRELAX_KEYSTORE" \
            --ks-key-alias "$AIMRELAX_KEY_ALIAS" \
            --ks-pass "pass:$AIMRELAX_STORE_PASSWORD" \
            --key-pass "pass:$AIMRELAX_KEY_PASSWORD" \
            --out "release/AIMRELAX-LIVE-V10.2-SIGNED.apk" \
            "$APK"

          echo ""
          echo "SIGNED APK:"
          ls -lh "release/AIMRELAX-LIVE-V10.2-SIGNED.apk"

      # --------------------------------------------------
      # 18. Verify APK signature
      # --------------------------------------------------
      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="release/AIMRELAX-LIVE-V10.2-SIGNED.apk"

          echo "======================================"
          echo "VERIFYING APK SIGNATURE"
          echo "======================================"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "Checking META-INF signature files..."

          unzip -l "$APK" | grep -E \
            'META-INF/.*\.(RSA|DSA|EC|SF)$'

          echo ""
          echo "======================================"
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"
          echo "======================================"

      # --------------------------------------------------
      # 19. Final APK information
      # --------------------------------------------------
      - name: Final APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          APK="release/AIMRELAX-LIVE-V10.2-SIGNED.apk"

          echo ""
          echo "======================================"
          echo "FINAL AIMRELAX LIVE APK"
          echo "======================================"

          ls -lh "$APK"

          file "$APK"

          unzip -t "$APK" > /dev/null

          echo ""
          echo "APK archive integrity: OK"
          echo "APK ready for download."

      # --------------------------------------------------
      # 20. Upload final APK
      # --------------------------------------------------
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-V10.2-ANDROID-SIGNED
          path: ${{ env.PROJECT_DIR }}/release/AIMRELAX-LIVE-V10.2-SIGNED.apk
          if-no-files-found: error
