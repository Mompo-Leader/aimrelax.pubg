name: AIMRELAX LIVE - Android Verified APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract AIMRELAX LIVE project
        run: |
          set -e

          echo "=== BEFORE EXTRACTION ==="
          ls -la

          if [ ! -f "AIMRELAX_LIVE_V10_ROOT_READY.zip" ]; then
            echo "ERROR: AIMRELAX_LIVE_V10_ROOT_READY.zip not found"
            exit 1
          fi

          echo "=== EXTRACTING PROJECT ==="
          unzip -o "AIMRELAX_LIVE_V10_ROOT_READY.zip" -d .

          echo "=== AFTER EXTRACTION ==="
          ls -la

          echo "=== CHECK REQUIRED FILES ==="

          test -f "./build-live-v2.sh"
          test -f "./pubspec.yaml"
          test -d "./lib"
          test -d "./scripts"

          echo "build-live-v2.sh FOUND"
          echo "pubspec.yaml FOUND"
          echo "lib/ FOUND"
          echo "scripts/ FOUND"

          chmod +x ./build-live-v2.sh
          chmod +x ./scripts/prepare_signing.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter
        run: |
          flutter --version

      - name: Build AIMRELAX LIVE
        run: |
          set -e
          chmod +x ./build-live-v2.sh
          ./build-live-v2.sh

      - name: Find generated APK
        run: |
          echo "=== ALL APK FILES ==="
          find . -type f -name "*.apk" -print

      - name: Verify APK exists
        run: |
          set -e

          APK="release/AIMRELAX-LIVE-V2-ANDROID-SIGNED.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK was not generated"
            exit 1
          fi

          echo "SIGNED APK FOUND:"
          ls -lh "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-VERIFIED-ANDROID-APK
          path: release/AIMRELAX-LIVE-V2-ANDROID-SIGNED.apk
          if-no-files-found: error
