<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIMRELAX LIVE</title><style>body{background:#080808;color:#fff;font-family:Arial;margin:0}.wrap{max-width:900px;margin:auto;padding:22px}.card{display:block;color:#fff;text-decoration:none;background:#141414;border-radius:14px;padding:18px;margin:12px 0}.live{color:#f44;font-weight:700}</style></head><body><div class="wrap"><h1>🔴 AIMRELAX LIVE</h1><div id="list">Loading…</div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://YOUR_PROJECT.supabase.co','YOUR_SUPABASE_ANON_KEY');const list=document.querySelector('#list');const {data,error}=await db.from('live_streams').select('id,title,streamer_name,viewer_count,created_at').eq('status','live').order('created_at',{ascending:false});if(error)list.textContent=error.message;else if(!data?.length)list.textContent='Այս պահին LIVE չկա';else list.innerHTML=data.map(x=>`<a class="card" href="live.html?stream_id=${x.id}"><div class="live">🔴 LIVE</div><h2>${x.title||'PUBG LIVE'}</h2><div>${x.streamer_name||'Streamer'} • 👁 ${x.viewer_count||0}</div></a>`).join('');</script></body></html>
