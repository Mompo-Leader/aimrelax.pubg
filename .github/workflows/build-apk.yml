name: AIMRELAX LIVE - Android Verified APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la
          echo "=== BUILD SCRIPT ==="
          test -f ./build-live-v2.sh
          ls -l ./build-live-v2.sh
          chmod +x ./build-live-v2.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build signed APK
        run: |
          chmod +x ./build-live-v2.sh
          ./build-live-v2.sh

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-VERIFIED-ANDROID-APK
          path: |
            release/*.apk
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
