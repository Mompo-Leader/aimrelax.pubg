name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Check that V3 ZIP exists
      - name: Check V4 ZIP
        run: |
          echo "Files in repository:"
          ls -lah

          if [ ! -f "./AIMRELAX_LIVE_FIXED_V4.zip" ]; then
            echo "ERROR: AIMRELAX_LIVE_FIXED_V4.zip not found!"
            exit 1
          fi

          echo "V4 ZIP found successfully."

      # 3. Extract ONLY V4
      - name: Extract V4 project
        run: |
          rm -rf build_project
          mkdir -p build_project

          unzip -o "./AIMRELAX_LIVE_FIXED_V4.zip" -d build_project

          echo "Extracted files:"
          find build_project -maxdepth 3 -type f | head -100

          PUBSPEC=$(find build_project -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # 4. Check Supabase URLs BEFORE Flutter build
      - name: Verify Supabase configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Checking Supabase configuration..."

          echo ""
          echo "Correct Supabase hostname:"
          grep -RIn "hvhlrbfjloiahbqmnrly.supabase.co" . \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.dart_tool \
            || true

          echo ""
          echo "Checking for OLD Supabase hostname..."

          if grep -RIn "hvhirbfjloiahbqmnrly.supabase.co" . \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.dart_tool; then

            echo ""
            echo "ERROR: OLD Supabase hostname FOUND!"
            echo "Build stopped intentionally."
            exit 1
          fi

          echo ""
          echo "SUCCESS: OLD Supabase hostname was NOT found."

      # 5. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 6. Generate modern Android project
      - name: Generate modern Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --org=com.aimrelax \
            --project-name=aimrelax_live \
            .

      # 7. Configure Android
      - name: Configure Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          s = p.read_text()

          if '<uses-permission android:name="android.permission.INTERNET"/>' in s:
              s = s.replace(
                  '<uses-permission android:name="android.permission.INTERNET"/>',
                  '''<uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
          <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
          <uses-permission android:name="android.permission.RECORD_AUDIO"/>
          <uses-permission android:name="android.permission.CAMERA"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'''
              )

          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")

          if p.exists():
              s = p.read_text()

              s = s.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 23"
              )

              p.write_text(s)
          PY

      # 8. Get Flutter dependencies
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # 9. FINAL SOURCE CHECK
      # This check happens immediately before APK build.
      - name: Final Supabase URL check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========== FINAL SUPABASE CHECK =========="

          echo ""
          echo "Correct hostname occurrences:"
          grep -RIn "hvhlrbfjloiahbqmnrly.supabase.co" . \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.dart_tool \
            || true

          echo ""
          echo "Old hostname occurrences:"

          if grep -RIn "hvhirbfjloiahbqmnrly.supabase.co" . \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.dart_tool; then

            echo ""
            echo "ERROR: OLD HOSTNAME FOUND BEFORE BUILD!"
            exit 1
          fi

          echo ""
          echo "FINAL CHECK PASSED."
          echo "No old hvhir hostname exists in the source."

      # 10. Build APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      # 11. Verify APK exists
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo ""
          echo "APK successfully created:"
          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-Android-V4
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
