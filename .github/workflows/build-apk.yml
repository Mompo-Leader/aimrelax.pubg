name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # 2. Check V6 ZIP
      # =========================
      - name: Check V6 ZIP
        run: |
          echo "======================================"
          echo "Checking repository files..."
          echo "======================================"

          ls -lah

          if [ ! -f "./AIMRELAX_LIVE_FIXED_V6.zip" ]; then
            echo "ERROR: AIMRELAX_LIVE_FIXED_V6.zip not found!"
            exit 1
          fi

          echo "SUCCESS: V6 ZIP found."


      # =========================
      # 3. Extract V6 project
      # =========================
      - name: Extract V6 project
        run: |
          echo "======================================"
          echo "Extracting V6 project..."
          echo "======================================"

          rm -rf build_project
          mkdir -p build_project

          unzip -o "./AIMRELAX_LIVE_FIXED_V6.zip" -d build_project

          PUBSPEC=$(find build_project -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"


      # =========================
      # 4. Show project files
      # =========================
      - name: Inspect V6 project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "V6 PROJECT FILES"
          echo "======================================"

          ls -lah

          echo ""
          echo "Dart files:"
          find lib -type f -name "*.dart" -print || true


      # =========================
      # 5. Verify Supabase configuration
      # =========================
      - name: Verify Supabase configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "SUPABASE CONFIGURATION CHECK"
          echo "======================================"

          echo ""
          echo "Correct hostname occurrences:"
          grep -RIn "hvhlrbfjloiahbqmnrly.supabase.co" . \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.dart_tool \
            || true

          echo ""
          echo "Checking for OLD incorrect hostname..."

          if grep -RIn "hvhirbfjloiahbqmnrly.supabase.co" . \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.dart_tool; then

            echo ""
            echo "ERROR: OLD SUPABASE HOSTNAME FOUND!"
            exit 1
          fi

          echo ""
          echo "SUCCESS: OLD hostname was NOT found."


      # =========================
      # 6. Check V6 marker
      # =========================
      - name: Verify V6 marker
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "CHECKING V6 VERSION MARKER"
          echo "======================================"

          if grep -RIn "VERSION V6" lib . \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.dart_tool; then

            echo ""
            echo "SUCCESS: VERSION V6 marker found."
          else
            echo ""
            echo "WARNING: VERSION V6 marker was not found."
            echo "Continuing build..."
          fi


      # =========================
      # 7. Setup Flutter
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # =========================
      # 8. Generate modern Android project
      # =========================
      - name: Generate modern Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "Generating Android project..."
          echo "======================================"

          rm -rf android

          flutter create \
            --platforms=android \
            --org=com.aimrelax \
            --project-name=aimrelax_live \
            .


      # =========================
      # 9. Configure Android
      # =========================
      - name: Configure Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "======================================"
          echo "Configuring Android..."
          echo "======================================"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
              '<uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          ]

          if '<manifest' in s:
              insert = "\n".join(
                  p for p in permissions
                  if p not in s
              )

              s = s.replace(
                  '<application',
                  insert + '\n\n    <application',
                  1
              )

          p.write_text(s)

          print("Android permissions configured.")
          PY


          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")

          if p.exists():
              s = p.read_text()

              s = s.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 23"
              )

              p.write_text(s)

              print("minSdk configured to 
