name: Build AIMRELAX LIVE V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AIMRELAX LIVE V6
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------
      # 2. Find Flutter project automatically
      # ---------------------------------------------
      - name: Find Flutter project
        shell: bash
        run: |
          echo "Searching for pubspec.yaml..."

          PUBSPEC=$(find . -name "pubspec.yaml" -not -path "./.git/*" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml was not found."
            echo "This repository does not contain a Flutter project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR="${PROJECT_DIR#./}"
          fi

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "ERROR: lib/main.dart not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: android directory not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ---------------------------------------------
      # 3. Setup Flutter
      # ---------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------
      # 4. Show versions
      # ---------------------------------------------
      - name: Flutter and Dart version
        run: |
          flutter --version
          dart --version

      # ---------------------------------------------
      # 5. Show project structure
      # ---------------------------------------------
      - name: Verify project
        run: |
          echo "Project directory: $PROJECT_DIR"
          echo "pubspec.yaml:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Flutter files:"
          find "$PROJECT_DIR" -maxdepth 2 -type f \
            \( -name "*.dart" -o -name "pubspec.yaml" \) \
            | sort

      # ---------------------------------------------
      # 6. Get dependencies
      # ---------------------------------------------
      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # ---------------------------------------------
      # 7. Analyze
      # ---------------------------------------------
      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos

      # ---------------------------------------------
      # 8. Clean
      # ---------------------------------------------
      - name: Flutter clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter clean

      # ---------------------------------------------
      # 9. Get dependencies again
      # ---------------------------------------------
      - name: Flutter pub get after clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # ---------------------------------------------
      # 10. Build release APK
      # ---------------------------------------------
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      # ---------------------------------------------
      # 11. Verify APK
      # ---------------------------------------------
      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Searching for generated APK files..."
            find "$PROJECT_DIR/build" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # ---------------------------------------------
      # 12. Rename APK
      # ---------------------------------------------
      - name: Rename APK
        run: |
          mkdir -p release

          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" \
             release/AIMRELAX-LIVE-V6.apk

          ls -lh release/AIMRELAX-LIVE-V6.apk

      # ---------------------------------------------
      # 13. Upload APK
      # ---------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-V6
          path: release/AIMRELAX-LIVE-V6.apk
          if-no-files-found: error
          retention-days: 30
