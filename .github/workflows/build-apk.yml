name: AIMRELAX LIVE - Android Verified APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find AIMRELAX ZIP
        run: |
          set -e

          echo "=== Repository files ==="
          ls -la

          ZIP=$(find . -maxdepth 1 -type f -name 'AIMRELAX_LIVE_*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: AIMRELAX LIVE ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          unzip -o "$ZIP" -d .

          echo "=== Extracted files ==="
          ls -la

          test -f "./build-live-v2.sh"
          test -f "./pubspec.yaml"
          test -d "./lib"
          test -d "./scripts"

          chmod +x ./build-live-v2.sh
          chmod +x ./scripts/prepare_signing.sh

          echo "Project structure OK"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare signing
        env:
          AIMRELAX_KEYSTORE_B64: ${{ secrets.AIMRELAX_KEYSTORE_B64 }}
          AIMRELAX_STORE_PASSWORD: ${{ secrets.AIMRELAX_STORE_PASSWORD }}
          AIMRELAX_KEY_PASSWORD: ${{ secrets.AIMRELAX_KEY_PASSWORD }}
          AIMRELAX_KEY_ALIAS: ${{ secrets.AIMRELAX_KEY_ALIAS }}
        run: |
          set -e

          bash scripts/prepare_signing.sh
          python3 scripts/configure_android.py

      - name: Build APK
        run: |
          set -e

          flutter pub get
          flutter analyze
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Sign APK
        run: |
          set -e

          source android/signing.env

          UNSIGNED="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$UNSIGNED"

          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          test -n "$APKSIGNER"

          mkdir -p release

          "$APKSIGNER" sign \
            --ks "$AIMRELAX_KEYSTORE" \
            --ks-key-alias "$AIMRELAX_KEY_ALIAS" \
            --ks-pass "pass:$AIMRELAX_STORE_PASSWORD" \
            --key-pass "pass:$AIMRELAX_KEY_PASSWORD" \
            --out release/AIMRELAX-LIVE-V2-ANDROID-SIGNED.apk \
            "$UNSIGNED"

      - name: Verify signature
        run: |
          set -e

          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            release/AIMRELAX-LIVE-V2-ANDROID-SIGNED.apk

          unzip -l release/AIMRELAX-LIVE-V2-ANDROID-SIGNED.apk \
            | grep -E 'META-INF/.*\.(RSA|DSA|EC|SF)$'

          echo "APK SIGNATURE VERIFIED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-VERIFIED-ANDROID-APK
          path: release/AIMRELAX-LIVE-V2-ANDROID-SIGNED.apk
          if-no-files-found: error
